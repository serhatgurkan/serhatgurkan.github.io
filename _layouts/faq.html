---
layout: default
---
<h1>{{ page.title }}</h1>

<div class="faq-list">
{% assign faq_items = site[page.collection_name] | sort: "path" %}
{% for item in faq_items %}
  <div class="faq-item">
    <h2>{{ item.title }}</h2>
    <div class="faq-answer">
      {{ item.content | markdownify }}
    </div>
  </div>
{% endfor %}
</div>
