<!-- GitHub Q&A Component -->
<!-- This file should be renamed to _includes/github_issue_qa.html -->
<div class="github-qa-component">
  <h2>Questions and Answers</h2>
  <div id="issues-list">
    <p>Loading...</p>
  </div>
</div>

<script>
// Simple fetch to get GitHub Issues and their comments (works for public repos)
const repo = 'serhatgurkan/serhatgurkan.github.io'; // Make sure this is the correct repository
const issuesList = document.getElementById('issues-list');
// Fetch only open issues labeled 'question'
fetch(`https://api.github.com/repos/${repo}/issues?state=open&labels=question`) // Changed label from 'soru' to 'question'
  .then(res => {
    if (!res.ok) {
      throw new Error(`HTTP error! status: ${res.status}`);
    }
    return res.json();
   })
  .then(issues => {
    if (!Array.isArray(issues) || issues.length === 0) {
      // If no questions are found, we can hide the section or update the message.
      // For now, let's show a simple message.
      issuesList.innerHTML = '<p>No questions asked with this label yet.</p>';
      // Alternatively, hide the entire component:
      // document.querySelector('.github-qa-component').style.display = 'none';
      return;
    }
    issuesList.innerHTML = ''; // Clear the list
    issues.forEach(issue => {
      const issueCard = document.createElement('div');
      issueCard.className = 'issue-card'; // Keep existing style class or define a new one
      issueCard.innerHTML = `
        <div class='issue-title'>${issue.title}</div>
        <div class='issue-body'>${issue.body ? issue.body.replace(/\n/g, '<br>') : '<em>No description provided.</em>'}</div>
        <div class='issue-meta'>Asked by: ${issue.user.login} | <a href='${issue.html_url}' target='_blank' rel='noopener noreferrer'>View on GitHub</a></div>
        <div class='issue-comments' id='comments-${issue.number}'><p><em>Loading comments...</em></p></div>
      `;
      issuesList.appendChild(issueCard);

      // Fetch comments (Answers)
      fetch(issue.comments_url)
        .then(res => {
           if (!res.ok) {
             throw new Error(`HTTP error! status: ${res.status}`);
           }
           return res.json();
        })
        .then(comments => {
          const commentsDiv = document.getElementById(`comments-${issue.number}`);
          if (!commentsDiv) return; // Element might not exist if main fetch failed fast

          if (!Array.isArray(comments) || comments.length === 0) {
            commentsDiv.innerHTML = '<em>No answers yet.</em>';
          } else {
            // Make comments more readable
            commentsDiv.innerHTML = '<strong>Answers:</strong>' + comments.map(c => `
              <div class='issue-comment'>
                <span class='comment-author'>${c.user.login}:</span>
                <div class='comment-body'>${c.body.replace(/\n/g, '<br>')}</div>
              </div>
            `).join('');
          }
        })
        .catch(err => {
          // Handle errors fetching comments
          const commentsDiv = document.getElementById(`comments-${issue.number}`);
          if (commentsDiv) {
            commentsDiv.innerHTML = '<em>Could not load comments.</em>';
          }
          console.error('Error fetching comments:', err);
        });
    });
  })
  .catch(err => {
    // Handle errors fetching issues
    issuesList.innerHTML = '<p>An error occurred while loading questions. Please try again later.</p>';
    console.error('Error fetching issues:', err);
  });
</script>
