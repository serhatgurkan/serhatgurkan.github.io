<!-- Soru Sor ve Cevapları Göster Componenti -->
<div class="issue-component">
  <h2>Soru Sor</h2>
  <form id="issueForm" action="https://github.com/serhatgurkan/serhatgurkan.github.io/issues/new" method="get" target="_blank">
    <input type="text" name="title" placeholder="Sorunuzu başlık olarak yazın" required class="issue-input" />
    <textarea name="body" placeholder="Sorunuzun detayını yazın" required class="issue-textarea"></textarea>
    <button type="submit" class="issue-btn">GitHub'da Soru Sor</button>
  </form>

  <h2>Son Sorular ve Cevaplar</h2>
  <div id="issues-list">
    <p>Yükleniyor...</p>
  </div>
</div>

<script>
// GitHub Issues'ı ve cevaplarını çekmek için basit bir fetch (public repo için çalışır)
const repo = 'serhatgurkan/serhatgurkan.github.io';
const issuesList = document.getElementById('issues-list');
fetch(`https://api.github.com/repos/${repo}/issues?state=open&labels=soru`)
  .then(res => res.json())
  .then(issues => {
    if (!Array.isArray(issues) || issues.length === 0) {
      issuesList.innerHTML = '<p>Henüz soru yok.</p>';
      return;
    }
    issuesList.innerHTML = '';
    issues.forEach(issue => {
      const div = document.createElement('div');
      div.className = 'issue-card';
      div.innerHTML = `
        <div class='issue-title'>${issue.title}</div>
        <div class='issue-body'>${issue.body ? issue.body.replace(/\n/g, '<br>') : ''}</div>
        <div class='issue-meta'>Soran: ${issue.user.login} | <a href='${issue.html_url}' target='_blank'>GitHub'da Gör</a></div>
        <div class='issue-comments' id='comments-${issue.number}'>Yorumlar yükleniyor...</div>
      `;
      issuesList.appendChild(div);
      // Cevapları çek
      fetch(issue.comments_url)
        .then(res => res.json())
        .then(comments => {
          const commentsDiv = document.getElementById(`comments-${issue.number}`);
          if (comments.length === 0) {
            commentsDiv.innerHTML = '<em>Henüz cevap yok.</em>';
          } else {
            commentsDiv.innerHTML = comments.map(c => `
              <div class='issue-comment'><b>${c.user.login}:</b> ${c.body.replace(/\n/g, '<br>')}</div>
            `).join('');
          }
        });
    });
  });
</script>
